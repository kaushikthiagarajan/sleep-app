<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sleep Companion | Hello World Clock & Ambient Sky</title>
  <meta name="description" content="A gorgeous, relaxing bedside sleep clock featuring custom spatial greetings, actual time and date, starry night background canvas, location tracking, and an ambient rain audio synthesizer.">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Twinkling Starry Night Sky Canvas -->
  <canvas id="sky-canvas" aria-hidden="true"></canvas>

  <main class="container">
    
    <!-- Top Greeting and Clock Glass Card -->
    <section class="glass-card greeting-section" id="main-clock-card">
      <div class="hello-world" id="hello-title">Hello, World</div>
      <h1 class="greeting-text" id="greeting-msg">Good Evening</h1>
      
      <div class="clock-display">
        <div class="time" id="clock-time" aria-live="polite">
          <span id="time-hours">00</span><span class="time-sep">:</span><span id="time-minutes">00</span><span class="time-sep">:</span><span id="time-seconds">00</span>
        </div>
        <div class="date-text" id="clock-date">Tuesday, May 19, 2026</div>
      </div>
    </section>

    <!-- Bottom Widgets Grid (Location & Ambient Audio) -->
    <div class="bottom-widgets">
      
      <!-- Location Widget -->
      <section class="glass-card widget-card" id="location-widget">
        <h2 class="widget-title">Current Location</h2>
        <div class="widget-content" id="location-display">
          <div class="spinner" id="location-spinner" style="display: none;"></div>
          <p class="location-value" id="location-city">Locating traveler...</p>
          <p class="location-coords" id="location-coords" style="display: none;"></p>
          <button class="location-btn" id="location-btn">Access Location</button>
        </div>
      </section>

      <!-- Ambient Audio Synthesizer Widget -->
      <section class="glass-card widget-card" id="audio-widget">
        <h2 class="widget-title">Ambient Sound</h2>
        <div class="widget-content">
          <button class="sound-btn" id="sound-toggle-btn" aria-label="Toggle ambient rain sound">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>
            </svg>
          </button>
          
          <div class="volume-container" id="volume-ctrl-container">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
            </svg>
            <input type="range" min="0" max="1" step="0.01" value="0.5" class="volume-slider" id="volume-slider" aria-label="Rain volume">
          </div>
        </div>
      </section>

    </div>

  </main>

  <footer class="footer">
    <p>Sleep Companion &bull; Rest Well &bull; Designed in Harmony</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
